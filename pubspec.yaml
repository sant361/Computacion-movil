name: streaming_app
description: +Wnovelas — aplicación móvil de streaming.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  cupertino_icons: ^1.0.6
  video_player: ^2.9.2
  http: ^1.2.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  video_player_platform_interface: ^6.4.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

# Configuración para generar el ícono de la app en todos los tamaños.
# Se ejecuta a mano con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: 'assets/icon/app_icon.png'
  adaptive_icon_background: '#000000'
  adaptive_icon_foreground: 'assets/icon/app_icon.png'

# Configuración para generar la pantalla de carga (splash screen).
# Se ejecuta a mano con: dart run flutter_native_splash:create
flutter_native_splash:
  color: '#000000'
  image: assets/icon/app_icon.png
  android_12:
    color: '#000000'
    image: assets/icon/app_icon.png
